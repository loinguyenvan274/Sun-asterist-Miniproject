<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/employees/list}">Employee Management</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" th:href="@{/employees/list}">Employees</a>
            <a class="nav-link" th:href="@{/employees/add}">Add Employee</a>
            <a class="nav-link" th:href="@{/employees/statistics}">Statistics</a>
        </div>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link" th:href="@{/register}">Register</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm ms-2">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-dark">Employee List</h2>
        <a th:href="@{/employees/add}" class="btn btn-success">+ Add New Employee</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/employees/search}" method="get" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="Search by name..." th:value="${searchName}">
                </div>
                <div class="col-md-4">
                    <input type="text" name="department" class="form-control" placeholder="Search by department..." th:value="${searchDepartment}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                    <a th:href="@{/employees/list}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Code</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Salary</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="emp : ${employees}">
                        <td th:text="${emp.id}">1</td>
                        <td><span class="badge bg-secondary" th:text="${emp.employeeCode}">EMP1001</span></td>
                        <td class="fw-semibold" th:text="${emp.fullName}">Nguyen Van An</td>
                        <td th:text="${emp.email}">an.nguyen@example.com</td>
                        <td><span class="badge bg-info text-dark" th:text="${emp.department}">IT</span></td>
                        <td th:text="${emp.position}">Backend Developer</td>
                        <td th:text="${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')} + ' $'">1,500.00 $</td>
                        <td class="text-center">
                            <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                               class="btn btn-outline-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="8" class="text-center text-muted py-4">No employees found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
