<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee - Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/employees/list}">Employee Management</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/employees/list}">Employees</a>
            <a class="nav-link active" th:href="@{/employees/add}">Add Employee</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Employee</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/employees/add}" th:object="${employee}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Enter full name">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="name@example.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <input type="text" id="department" th:field="*{department}" class="form-control"
                                   list="departmentOptions"
                                   th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''"
                                   placeholder="e.g. IT, HR, FINANCE">
                            <datalist id="departmentOptions">
                                <option th:each="dept : ${departments}" th:value="${dept.name}" th:text="${dept.name}"></option>
                            </datalist>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="position" class="form-label fw-semibold">Position</label>
                            <input type="text" id="position" th:field="*{position}" class="form-control"
                                   th:classappend="${#fields.hasErrors('position')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Software Engineer">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="salary" class="form-label fw-semibold">Salary ($)</label>
                            <input type="number" step="0.01" id="salary" th:field="*{salary}" class="form-control"
                                   th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''"
                                   placeholder="e.g. 1500.00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/employees/list}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Employee</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
